<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURI - Multimedia Self-Regulation</title>
    
    <!-- 1. GOOGLE ANALYTICS 4 (GA4) -->
    <!-- Ваш идентификатор G-331Z9YR18C уже вписан ниже -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-331Z9YR18C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-331Z9YR18C'); 
    </script>

    <!-- Внешние библиотеки (CDN) для работы React, Tailwind и иконок -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Анимации для визуального сопровождения практик */
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.3; background-color: #e0e7ff; }
            50% { transform: scale(1.6); opacity: 1; background-color: #818cf8; }
        }
        .animate-breathe {
            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes vibration {
            0% { transform: translate(0, 0); }
            25% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            75% { transform: translate(2px, 2px); }
            100% { transform: translate(0, 0); }
        }
        .animate-vibration {
            animation: vibration 0.1s linear infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nuri-card-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        /**
         * Функция отправки событий в Google Analytics
         */
        const trackEvent = (action, label, params = {}) => {
            if (window.gtag) {
                window.gtag('event', action, {
                    'event_category': 'NURI_MVP',
                    'event_label': label,
                    ...params
                });
            }
        };

        // --- БАЗА ДАННЫХ ПРАКТИК ---
        const TOOLS = [
            { 
                id: 1, 
                title: "Square Breathing", 
                category: "breath", 
                route_tags: ["panic", "anxiety", "stress", "overwhelm"], 
                why_it_helps: "Slows the heart rate and anchors the mind through rhythmic counting.", 
                steps: ["Inhale for 4 seconds", "Hold your breath for 4 seconds", "Exhale slowly for 4 seconds", "Hold empty for 4 seconds"], 
                safety_notes: "Return to normal breathing if you feel any dizziness.",
                animation: "breathe"
            },
            { 
                id: 4, 
                title: "Body Shaking", 
                category: "movement", 
                route_tags: ["stress", "anxiety", "body"], 
                why_it_helps: "Physically discharges adrenaline and releases deep muscle tension.", 
                steps: ["Stand with feet shoulder-width apart", "Start shaking your wrists", "Let the movement travel to your shoulders", "Shake your entire body for 1 minute"], 
                safety_notes: "Keep your joints loose and movements fluid.",
                animation: "vibrate"
            },
            { 
                id: 8, 
                title: "5-4-3-2-1 Grounding", 
                category: "sensory", 
                route_tags: ["panic", "derealization", "unknown"], 
                why_it_helps: "Forces the brain to switch from internal distress to external reality.", 
                steps: ["Find 5 things you can see", "4 sounds you can hear", "3 things you can touch", "2 smells", "1 taste"], 
                safety_notes: "Choose neutral objects in your immediate environment.",
                animation: "pulse"
            },
            { 
                id: 2, 
                title: "Extended Exhale", 
                category: "breath", 
                route_tags: ["anxiety", "stress"], 
                why_it_helps: "Activates the parasympathetic nervous system to signal safety.", 
                steps: ["Inhale deeply through your nose", "Exhale through pursed lips twice as long", "Repeat for 5 cycles"], 
                safety_notes: "Make the exhale effortless, like blowing out a candle.",
                animation: "breathe"
            }
        ];

        const CATEGORIES = {
            all: { label: "All", icon: "BookOpen" },
            breath: { label: "Breath", icon: "Wind" },
            movement: { label: "Body", icon: "Activity" },
            sensory: { label: "Sensory", icon: "Eye" },
        };

        // --- ВСПОМОГАТЕЛЬНЫЕ КОМПОНЕНТЫ ---

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name.toLowerCase()} style={{ width: size, height: size }} className={className}></i>;
        };

        const MultimediaAid = ({ type, colorClass }) => {
            if (type === 'breathe') {
                return (
                    <div className="relative w-40 h-40 mx-auto flex items-center justify-center my-8">
                        <div className="absolute w-24 h-24 rounded-full animate-breathe opacity-50"></div>
                        <div className={`w-12 h-12 rounded-full z-10 shadow-lg ${colorClass}`}></div>
                    </div>
                );
            }
            if (type === 'vibrate') {
                return (
                    <div className="w-40 h-40 mx-auto flex items-center justify-center my-8">
                        <div className={`w-24 h-24 rounded-3xl animate-vibration flex items-center justify-center text-white shadow-xl ${colorClass}`}>
                            <Icon name="Zap" size={40} />
                        </div>
                    </div>
                );
            }
            if (type === 'pulse') {
                return (
                    <div className="relative w-40 h-40 mx-auto flex items-center justify-center my-8">
                        <div className={`absolute w-24 h-24 rounded-full animate-pulse-ring border-4 ${colorClass.replace('bg-', 'border-')}`}></div>
                        <div className={`w-20 h-20 rounded-full flex items-center justify-center text-white shadow-lg ${colorClass}`}>
                            <Icon name="Eye" size={32} />
                        </div>
                    </div>
                );
            }
            return null;
        };

        function App() {
            const [view, setView] = useState('landing'); 
            const [selections, setSelections] = useState({ route: null, branch: null, step: 0 });
            const [selectedTool, setSelectedTool] = useState(null);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [toolkitFilter, setToolkitFilter] = useState('all');

            const ROUTE_OPTIONS = [
                { id: 'panic', text: 'Panic attack', branch: 'A', icon: 'AlertTriangle' },
                { id: 'anxiety', text: 'Anxiety', branch: 'B', icon: 'Wind' },
                { id: 'body', text: 'Body Sensation', branch: 'C', icon: 'Activity' },
                { id: 'unknown', text: "I don't know", branch: 'C', icon: 'HelpCircle' }
            ];

            const branchConfig = {
                'A': { color: 'bg-rose-600', text: 'text-rose-600', light: 'bg-rose-50', border: 'border-rose-100', steps: 2 },
                'B': { color: 'bg-indigo-600', text: 'text-indigo-600', light: 'bg-indigo-50', border: 'border-indigo-100', steps: 3 },
                'C': { color: 'bg-teal-600', text: 'text-teal-600', light: 'bg-teal-50', border: 'border-teal-100', steps: 4 },
                'default': { color: 'bg-slate-900', text: 'text-slate-900', light: 'bg-slate-100', border: 'border-slate-200', steps: 1 }
            };

            const theme = selections.branch ? branchConfig[selections.branch] : branchConfig['default'];

            const handleVoice = () => {
                if (isSpeaking) {
                    window.speechSynthesis.cancel();
                    setIsSpeaking(false);
                    trackEvent('voice_stop', selectedTool.title);
                    return;
                }
                const msg = new SpeechSynthesisUtterance();
                msg.text = `${selectedTool.title}. ${selectedTool.why_it_helps}. Step 1: ${selectedTool.steps.join(". Step ")}`;
                msg.onend = () => setIsSpeaking(false);
                window.speechSynthesis.speak(msg);
                setIsSpeaking(true);
                trackEvent('voice_start', selectedTool.title);
            };

            const nextView = (opt) => {
                trackEvent('select_route', opt.text);
                setSelections({ ...selections, route: opt.id, branch: opt.branch, step: 0 });
                if (opt.branch === 'A') setView('results');
                else setView('questions');
            };

            const handleQuestion = (goal) => {
                trackEvent('answer_question', goal);
                if (selections.branch === 'B' || selections.step === 1) setView('results');
                else setSelections({ ...selections, step: 1 });
            };

            const Layout = ({ children, title, subtitle, onBack }) => (
                <div className={`min-h-screen flex flex-col items-center p-6 md:p-12 fade-in transition-colors duration-700 ${view !== 'landing' ? theme.light.replace('bg-', 'bg-opacity-40 bg-') : ''}`}>
                    <div className="w-full max-w-xl flex flex-col gap-8">
                        {onBack && (
                            <button onClick={() => { window.speechSynthesis.cancel(); setIsSpeaking(false); onBack(); }} className="flex items-center text-slate-400 hover:text-slate-900 transition w-fit group">
                                <Icon name="ArrowLeft" size={20} className="mr-2 group-hover:-translate-x-1 transition-transform" />
                                <span className="font-bold uppercase text-[10px] tracking-widest">Back</span>
                            </button>
                        )}
                        <div className="text-center">
                            <h1 className="text-4xl md:text-5xl font-black tracking-tighter mb-3 text-slate-900 leading-none">{title}</h1>
                            <p className="text-slate-500 text-lg font-medium leading-relaxed">{subtitle}</p>
                        </div>
                        {children}
                        <footer className="mt-auto pt-12 text-center text-[10px] text-slate-300 font-black uppercase tracking-widest">
                            NURI &bull; MULTIMEDIA MVP &bull; {new Date().getFullYear()}
                        </footer>
                    </div>
                </div>
            );

            // --- РЕНДЕРИНГ ЭКРАНОВ ---

            if (view === 'landing') {
                return (
                    <div className="min-h-screen bg-white flex items-center justify-center p-8 text-center">
                        <div className="max-w-md w-full fade-in">
                            <div className="mb-10 inline-flex p-10 bg-slate-900 text-white rounded-[3.5rem] shadow-2xl">
                                <Icon name="Zap" size={64} />
                            </div>
                            <h1 className="text-8xl font-black mb-4 tracking-tighter text-slate-900 leading-none">NURI</h1>
                            <p className="text-slate-500 text-xl md:text-2xl mb-12 font-medium">Digital toolkit for sensory regulation.</p>
                            <div className="flex flex-col gap-4">
                                <button onClick={() => { setView('routing'); trackEvent('start_session', 'Help Me Now'); }} className="w-full bg-slate-900 text-white py-6 rounded-[2.5rem] font-black text-xl shadow-2xl active:scale-95 transition-transform">
                                    Help Me Now
                                </button>
                                <button onClick={() => { setView('toolkit'); trackEvent('browse_toolkit', 'Main'); }} className="w-full bg-white border-2 border-slate-100 text-slate-400 py-6 rounded-[2.5rem] font-bold text-lg hover:border-slate-200 transition">
                                    Browse Toolkit
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'routing') {
                return (
                    <Layout title="How are you?" subtitle="Identify your current state." onBack={() => setView('landing')}>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {ROUTE_OPTIONS.map(opt => (
                                <button key={opt.id} onClick={() => nextView(opt)} className="p-8 text-left bg-white border border-slate-100 rounded-[2.5rem] nuri-card-shadow flex flex-col justify-between group h-44 hover:border-slate-900 transition-all">
                                    <Icon name={opt.icon} size={28} className="text-slate-300 group-hover:text-slate-900 transition-colors" />
                                    <span className="font-bold text-slate-900 text-xl leading-tight">{opt.text}</span>
                                </button>
                            ))}
                        </div>
                    </Layout>
                );
            }

            if (view === 'questions') {
                const isBranchB = selections.branch === 'B';
                const opts = isBranchB ? ["Calm down fast", "Stop racing thoughts", "Release body tension", "Feel safe"] 
                                       : (selections.step === 0 ? ["Chest", "Head", "Stomach", "Muscle tension"] : ["1 min", "3 mins", "5+ mins"]);
                return (
                    <Layout title={isBranchB ? "Goal" : (selections.step === 0 ? "Focus" : "Time")} subtitle="Narrowing down the technique..." onBack={() => { if(selections.step === 1) setSelections({...selections, step: 0}); else setView('routing'); }}>
                        <div className="flex flex-col gap-3">
                            {opts.map((o, i) => (
                                <button key={i} onClick={() => handleQuestion(o)} className="p-7 text-left bg-white border border-slate-100 rounded-[2.5rem] nuri-card-shadow hover:border-slate-900 transition-all flex items-center justify-between group">
                                    <span className="font-bold text-slate-800 text-xl">{o}</span>
                                    <Icon name="ChevronRight" size={24} className="text-slate-200 group-hover:text-slate-900" />
                                </button>
                            ))}
                        </div>
                    </Layout>
                );
            }

            if (view === 'results') {
                const results = TOOLS.filter(t => t.route_tags.includes(selections.route)).slice(0, 3);
                return (
                    <Layout title="Recommended" subtitle="Based on your selection." onBack={() => setView('routing')}>
                        <div className="space-y-4">
                            {results.map(t => (
                                <div key={t.id} className="bg-white p-7 rounded-[3rem] border border-slate-100 nuri-card-shadow flex flex-col gap-4">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <span className={`text-[10px] font-black uppercase tracking-widest ${theme.text}`}>{t.category}</span>
                                            <h3 className="text-2xl font-bold text-slate-900">{t.title}</h3>
                                        </div>
                                    </div>
                                    <p className="text-slate-500 leading-relaxed font-medium">{t.why_it_helps}</p>
                                    <button onClick={() => { setSelectedTool(t); setView('tool'); trackEvent('open_tool', t.title); }} className={`w-full text-white py-5 rounded-[1.5rem] font-black uppercase text-xs tracking-widest active:scale-95 transition-transform ${theme.color}`}>
                                        Begin Practice
                                    </button>
                                </div>
                            ))}
                        </div>
                    </Layout>
                );
            }

            if (view === 'toolkit') {
                const toolkitTools = toolkitFilter === 'all' ? TOOLS : TOOLS.filter(t => t.category === toolkitFilter);
                return (
                    <Layout title="Toolkit" subtitle="All available practices." onBack={() => setView('landing')}>
                        <div className="flex overflow-x-auto gap-3 pb-6 no-scrollbar">
                            {Object.entries(CATEGORIES).map(([id, cat]) => (
                                <button key={id} onClick={() => { setToolkitFilter(id); trackEvent('filter_toolkit', cat.label); }} className={`flex items-center gap-2 px-6 py-3 rounded-full text-[10px] font-black uppercase tracking-widest transition-all whitespace-nowrap ${toolkitFilter === id ? 'bg-slate-900 text-white shadow-lg' : 'bg-white border border-slate-100 text-slate-400'}`}>
                                    {cat.label}
                                </button>
                            ))}
                        </div>
                        <div className="grid gap-4">
                            {toolkitTools.map(t => (
                                <div key={t.id} onClick={() => { setSelectedTool(t); setView('tool'); trackEvent('open_tool', t.title); }} className="bg-white p-7 rounded-[2.5rem] border border-slate-100 nuri-card-shadow flex justify-between items-center cursor-pointer hover:border-slate-900 transition-all">
                                    <h3 className="text-xl font-bold text-slate-900">{t.title}</h3>
                                    <Icon name="ArrowRight" size={20} className="text-slate-300" />
                                </div>
                            ))}
                        </div>
                    </Layout>
                );
            }

            if (view === 'tool' && selectedTool) {
                return (
                    <Layout title={selectedTool.title} subtitle={`${selectedTool.category} Support`} onBack={() => setView('landing')}>
                        <div className="bg-white p-10 md:p-14 rounded-[4rem] border border-slate-100 shadow-2xl space-y-10">
                            
                            {/* ВИЗУАЛЬНОЕ СОПРОВОЖДЕНИЕ */}
                            <MultimediaAid type={selectedTool.animation} colorClass={theme.color} />

                            {/* ГОЛОСОВОЕ СОПРОВОЖДЕНИЕ */}
                            <button onClick={handleVoice} className={`w-full py-4 rounded-2xl border-2 flex items-center justify-center gap-3 font-bold transition-all ${isSpeaking ? 'bg-slate-900 text-white border-slate-900' : `${theme.text} ${theme.border} bg-white hover:bg-slate-50`}`}>
                                <Icon name={isSpeaking ? "Square" : "PlayCircle"} size={20} />
                                {isSpeaking ? "Stop Voice Guide" : "Play Voice Guide"}
                            </button>

                            {/* ШАГИ ПРАКТИКИ */}
                            <div className="space-y-8">
                                {selectedTool.steps.map((s, i) => (
                                    <div key={i} className="flex gap-6 items-start fade-in" style={{ animationDelay: `${i * 0.1}s` }}>
                                        <div className={`w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 font-black text-2xl shadow-sm ${theme.light} ${theme.text}`}>
                                            {i + 1}
                                        </div>
                                        <p className="text-xl md:text-2xl text-slate-800 font-bold leading-tight pt-1">{s}</p>
                                    </div>
                                ))}
                            </div>

                            <div className="pt-8 border-t border-slate-100 flex items-start gap-4">
                                <Icon name="ShieldAlert" size={24} className="text-amber-500 shrink-0 mt-1" />
                                <div className="text-xs text-slate-400 font-bold uppercase tracking-widest leading-relaxed">
                                    <span className="text-slate-600 mr-2">Safety:</span> {selectedTool.safety_notes}
                                </div>
                            </div>
                            
                            <button onClick={() => { window.speechSynthesis.cancel(); trackEvent('finish_practice', selectedTool.title); setView('landing'); }} className={`w-full py-6 rounded-[2.5rem] font-black text-xl shadow-xl active:scale-95 transition-transform text-white ${theme.color}`}>
                                Finish Session
                            </button>
                        </div>
                    </Layout>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
