<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURI - Instant Self-Regulation</title>
    
    <!-- ЗАЩИТА: Запрет индексации поисковиками -->
    <meta name="robots" content="noindex, nofollow">
    
    <!-- 1. GOOGLE ANALYTICS 4 (GA4) - ID: G-331Z9YR18C -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-331Z9YR18C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-331Z9YR18C'); 
    </script>

    <!-- Внешние библиотеки (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Статичные стили без анимаций */
        .fade-in { opacity: 1; } 

        .nuri-card-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- Аналитика: Функция отправки событий ---
        const trackEvent = (action, label, params = {}) => {
            if (window.gtag) {
                window.gtag('event', action, {
                    'event_category': 'NURI_MVP',
                    'event_label': label,
                    ...params
                });
            }
        };

        // --- БАЗА ДАННЫХ ПРАКТИК ---
        const TOOLS = [
            { id: 1, title: "Square Breathing", category: "breath", route_tags: ["panic", "anxiety", "stress"], why_it_helps: "Slows heart rate and anchors the mind.", steps: ["Inhale for 4s", "Hold for 4s", "Exhale for 4s", "Hold for 4s"], safety: "Stop if dizzy." },
            { id: 4, title: "Body Shaking", category: "movement", route_tags: ["stress", "anxiety", "body"], why_it_helps: "Discharges adrenaline physically.", steps: ["Stand up", "Shake wrists", "Shake shoulders", "Vibrate whole body"], safety: "Keep joints soft." },
            { id: 8, title: "5-4-3-2-1 Grounding", category: "sensory", route_tags: ["panic", "derealization", "unknown"], why_it_helps: "Brings focus to external reality.", steps: ["5 things you see", "4 hear", "3 touch", "2 smell", "1 taste"], safety: "Focus on neutral objects." }
        ];

        const CATEGORIES = {
            all: { label: "All", icon: "BookOpen" },
            breath: { label: "Breath", icon: "Wind" },
            movement: { label: "Body", icon: "Activity" },
            sensory: { label: "Sensory", icon: "Eye" },
        };

        // --- КОМПОНЕНТЫ ---
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name.toLowerCase()} style={{ width: size, height: size }} className={className}></i>;
        };

        function App() {
            const [view, setView] = useState('landing'); 
            const [selections, setSelections] = useState({ route: null, branch: null, step: 0 });
            const [selectedTool, setSelectedTool] = useState(null);
            const [toolkitFilter, setToolkitFilter] = useState('all');

            const theme = selections.branch === 'A' ? { color: 'bg-rose-600', text: 'text-rose-600', light: 'bg-rose-50' } :
                         selections.branch === 'C' ? { color: 'bg-teal-600', text: 'text-teal-600', light: 'bg-teal-50' } :
                         { color: 'bg-indigo-600', text: 'text-indigo-600', light: 'bg-indigo-50' };

            const Layout = ({ children, title, subtitle, onBack }) => (
                <div className={`min-h-screen flex flex-col items-center p-6 md:p-12 transition-colors duration-700 ${view !== 'landing' ? theme.light : 'bg-slate-50'}`}>
                    <div className="w-full max-w-xl flex flex-col gap-8">
                        {onBack && <button onClick={onBack} className="text-slate-400 hover:text-slate-900 flex items-center gap-2 transition w-fit group"><Icon name="ArrowLeft" size={20} className="mr-2" /> <span className="font-bold uppercase text-[10px] tracking-widest leading-none">Back</span></button>}
                        <div className="text-center">
                            <h1 className="text-4xl md:text-6xl font-black tracking-tighter text-slate-900 mb-2 leading-none">{title}</h1>
                            <p className="text-slate-500 text-lg font-medium">{subtitle}</p>
                        </div>
                        <div className="flex-1">{children}</div>
                        <footer className="mt-auto pt-10 text-center text-[10px] text-slate-300 font-bold uppercase tracking-widest leading-loose">
                            NURI MVP &bull; G-331Z9YR18C &bull; PROTECTED
                        </footer>
                    </div>
                </div>
            );

            if (view === 'landing') return (
                <div className="min-h-screen flex items-center justify-center p-8 bg-white text-center">
                    <div className="max-w-md w-full">
                        <div className="mb-10 inline-flex p-8 bg-slate-900 text-white rounded-[3rem] shadow-xl"><Icon name="Zap" size={48} /></div>
                        <h1 className="text-7xl font-black tracking-tighter text-slate-900 leading-none mb-4">NURI</h1>
                        <p className="text-slate-500 text-xl mb-12 font-medium">Instant Sensory Regulation.</p>
                        <div className="flex flex-col gap-4">
                            <button onClick={() => { setView('routing'); trackEvent('start_personalizer', 'Landing'); }} className="w-full bg-slate-900 text-white py-6 rounded-[2rem] font-black text-xl shadow-xl active:scale-95 transition-transform">Help Me Now</button>
                            <button onClick={() => { setView('toolkit'); trackEvent('browse_toolkit', 'Landing'); }} className="w-full bg-white border-2 border-slate-100 text-slate-400 py-6 rounded-[2rem] font-bold text-lg hover:border-slate-200 transition">Browse Toolkit</button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'routing') return (
                <Layout title="How are you?" subtitle="Identify your current state." onBack={() => setView('landing')}>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {[
                            { id: 'panic', text: 'Panic attack', branch: 'A', icon: 'AlertTriangle' },
                            { id: 'anxiety', text: 'Anxiety', branch: 'B', icon: 'Wind' },
                            { id: 'body', text: 'Body Sensation', branch: 'C', icon: 'Activity' },
                            { id: 'unknown', text: "I don't know", branch: 'C', icon: 'HelpCircle' }
                        ].map(opt => (
                            <button key={opt.id} onClick={() => { trackEvent('select_route', opt.text); setSelections({ route: opt.id, branch: opt.branch }); setView(opt.branch === 'A' ? 'results' : 'questions'); }} className="p-8 text-left bg-white border border-slate-100 rounded-[2.5rem] nuri-card-shadow flex flex-col justify-between group h-44 hover:border-slate-900 transition-all">
                                <Icon name={opt.icon} size={28} className="text-slate-300 group-hover:text-slate-900" />
                                <span className="font-bold text-slate-900 text-xl leading-tight">{opt.text}</span>
                            </button>
                        ))}
                    </div>
                </Layout>
            );

            if (view === 'questions') return (
                <Layout title="Refining" subtitle="What is your priority?" onBack={() => setView('routing')}>
                    <div className="flex flex-col gap-3">
                        {["Calm down fast", "Stop race of thoughts", "Release body tension"].map((o, i) => (
                            <button key={i} onClick={() => { trackEvent('answer_question', o); setView('results'); }} className="p-7 text-left bg-white border border-slate-100 rounded-[2.5rem] nuri-card-shadow hover:border-slate-900 transition-all flex items-center justify-between group"><span className="font-bold text-slate-800 text-xl">{o}</span><Icon name="ChevronRight" size={24} className="text-slate-200 group-hover:text-slate-900" /></button>
                        ))}
                    </div>
                </Layout>
            );

            if (view === 'results') return (
                <Layout title="Ready" subtitle="Top practices for you." onBack={() => setView('routing')}>
                    <div className="space-y-4">
                        {TOOLS.filter(t => t.route_tags.includes(selections.route)).map(t => (
                            <div key={t.id} className="bg-white p-7 rounded-[3rem] border border-slate-100 nuri-card-shadow flex flex-col gap-4">
                                <h3 className="text-2xl font-bold text-slate-900 leading-tight">{t.title}</h3>
                                <button onClick={() => { setSelectedTool(t); setView('tool'); trackEvent('open_tool', t.title); }} className={`w-full text-white py-5 rounded-[1.5rem] font-black uppercase text-xs tracking-widest ${theme.color} active:scale-95 transition-transform`}>Begin Practice</button>
                            </div>
                        ))}
                    </div>
                </Layout>
            );

            if (view === 'toolkit') {
                const toolkitTools = toolkitFilter === 'all' ? TOOLS : TOOLS.filter(t => t.category === toolkitFilter);
                return (
                    <Layout title="Toolkit" subtitle="All available methods." onBack={() => setView('landing')}>
                        <div className="flex overflow-x-auto gap-3 pb-6 no-scrollbar">
                            {Object.entries(CATEGORIES).map(([id, cat]) => (
                                <button key={id} onClick={() => { setToolkitFilter(id); trackEvent('filter_toolkit', cat.label); }} className={`flex items-center gap-2 px-6 py-3 rounded-full text-[10px] font-black uppercase tracking-widest transition-all whitespace-nowrap ${toolkitFilter === id ? 'bg-slate-900 text-white shadow-lg' : 'bg-white border border-slate-100 text-slate-400'}`}>
                                    {cat.label}
                                </button>
                            ))}
                        </div>
                        <div className="grid gap-4">
                            {toolkitTools.map(t => (
                                <div key={t.id} onClick={() => { setSelectedTool(t); setView('tool'); trackEvent('open_tool', t.title); }} className="bg-white p-7 rounded-[2.5rem] border border-slate-100 nuri-card-shadow flex justify-between items-center cursor-pointer hover:border-slate-900 transition-all">
                                    <h3 className="text-xl font-bold text-slate-900 leading-tight">{t.title}</h3>
                                    <Icon name="ArrowRight" size={20} className="text-slate-300" />
                                </div>
                            ))}
                        </div>
                    </Layout>
                );
            }

            if (view === 'tool' && selectedTool) return (
                <Layout title={selectedTool.title} subtitle="Text Guide" onBack={() => { setView('landing'); }}>
                    <div className="bg-white p-10 md:p-14 rounded-[4rem] border border-slate-50 shadow-2xl space-y-10">
                        {/* Чисто текстовые шаги без мультимедиа */}
                        <div className="space-y-8 text-left">
                            {selectedTool.steps.map((s, i) => (
                                <div key={i} className="flex gap-6 items-start">
                                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 font-black text-2xl shadow-sm bg-slate-100 ${theme.text}`}>
                                        {i + 1}
                                    </div>
                                    <p className="text-xl md:text-2xl text-slate-800 font-bold leading-tight pt-1">{s}</p>
                                </div>
                            ))}
                        </div>

                        <div className="pt-8 border-t border-slate-100 flex items-start gap-4 text-left">
                            <Icon name="ShieldAlert" size={24} className="text-amber-500 shrink-0 mt-1" />
                            <p className="text-xs text-slate-400 font-bold uppercase tracking-widest leading-relaxed">Safety: {selectedTool.safety}</p>
                        </div>
                        
                        <button onClick={() => { trackEvent('finish_practice', selectedTool.title); setView('landing'); }} className={`w-full py-6 rounded-[2.5rem] font-black text-xl shadow-xl active:scale-95 transition-transform text-white ${theme.color}`}>
                            Finish Practice
                        </button>
                    </div>
                </Layout>
            );

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
